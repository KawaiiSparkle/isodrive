<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>ISODrive+</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">◈</div>
      <div class="brand-text">
        <h1>ISODrive+</h1>
        <p class="sub">手机 → USB 启动盘 / CD-ROM</p>
      </div>
    </div>
    <div class="pills">
      <span id="pill-conn" class="pill">连接中</span>
      <span id="pill-selinux" class="pill">SELinux</span>
    </div>
  </header>
  <div id="banner-none" class="banner hidden"></div>
  <main id="view" class="view"></main>
  <nav class="tabbar" id="tabbar">
    <button type="button" class="tab" data-act="tab" data-tab="home"><span class="ico">◉</span><span>概览</span></button>
    <button type="button" class="tab" data-act="tab" data-tab="images"><span class="ico">▤</span><span>镜像</span></button>
    <button type="button" class="tab" data-act="tab" data-tab="tools"><span class="ico">⚙</span><span>工具</span></button>
    <button type="button" class="tab" data-act="tab" data-tab="settings"><span class="ico">☰</span><span>设置</span></button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
