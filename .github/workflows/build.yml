name: Build Magisk module

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Cross-compile engine (4 ABIs, API 23)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/cross-compile-kelexine.sh build-zip.sh
          ./scripts/cross-compile-kelexine.sh

      - name: Package module zip
        run: ./build-zip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: isodrive-plus
          path: isodrive-plus.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: isodrive-plus.zip
          generate_release_notes: true
